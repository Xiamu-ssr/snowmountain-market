name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build precompiled plugin package
        run: |
          npm pack
          mv xiamu-ssr-dsh-wind-aifin-*.tgz dsh-wind-aifin.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dsh-wind-aifin.tgz --generate-notes --verify-tag

